services:
  postgres:
    image: postgres:16-alpine
    container_name: rms-postgres
    environment:
      POSTGRES_DB: rms_db
      POSTGRES_USER: rms_user
      POSTGRES_PASSWORD: rms_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rms_user"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
